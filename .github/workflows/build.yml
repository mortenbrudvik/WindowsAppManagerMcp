name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        run: |
          dotnet publish src/WindowsAppManagerMcp/WindowsAppManagerMcp.csproj `
            --configuration Release `
            --output ./publish `
            --self-contained false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsAppManagerMcp
          path: publish/

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: WindowsAppManagerMcp
          path: ./release

      - name: Create zip
        run: Compress-Archive -Path ./release/* -DestinationPath WindowsAppManagerMcp.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: WindowsAppManagerMcp.zip
          generate_release_notes: true
