name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the plugin binary check diffs the build inputs (src/, config/, root build
          # files) against the commit the exe was built from.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        run: |
          dotnet publish src/WindowsAppManagerMcp/WindowsAppManagerMcp.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            --output ./publish

      # bin/WindowsAppManagerMcp.exe is the exe the Claude Code plugin runs. A v* tag must ship an
      # exe built from the tagged sources with the tagged version (scripts/Publish-Plugin.ps1).
      # A push or pull request that changes the exe gets the same strict check (without the tag),
      # so a stale or hand-built exe fails when it is committed; users install the plugin from main.
      # Otherwise a stale exe is expected until the next release, so it is only a warning.
      - name: Verify committed plugin binary
        shell: pwsh
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./scripts/Test-PluginBinary.ps1 -Tag $env:GITHUB_REF_NAME
          } else {
            . ./scripts/ReleaseCommon.ps1
            if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
              $change = Test-PluginBinaryChanged -Root $PWD.Path -Base $env:PR_BASE_SHA -Head $env:PR_HEAD_SHA -SinceMergeBase
            } else {
              $change = Test-PluginBinaryChanged -Root $PWD.Path -Base $env:PUSH_BEFORE_SHA -Head $env:GITHUB_SHA
            }
            Write-Host $change.Reason
            if ($change.Changed) {
              ./scripts/Test-PluginBinary.ps1
            } else {
              ./scripts/Test-PluginBinary.ps1 -WarnOnly
            }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsAppManagerMcp
          path: publish/

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Creating a release needs write access. The repository's default GITHUB_TOKEN is read-only,
    # which is why the release job failed ("Too many retries.") for every tag up to v1.11.0.
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: WindowsAppManagerMcp
          path: ./release

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path ./release/* -DestinationPath "WindowsAppManagerMcp-$env:GITHUB_REF_NAME-win-x64.zip"

      # The GitHub CLI preinstalled on the runner creates the release, so no third-party action runs
      # with this job's write token. --verify-tag refuses to create a missing tag. A re-run of the
      # job replaces the asset of the release the first run created.
      - name: Create Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 'gh release view' fails when the release does not exist yet, the usual case.
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $zip = "WindowsAppManagerMcp-$tag-win-x64.zip"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title $tag --generate-notes --verify-tag
          }
