name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Desktop tests launch real apps; they are skipped unless this is exactly 1.
      # See TESTING.md, "Desktop Tests".
      WAM_ALLOW_DESKTOP_TESTS: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        # Category!=Desktop leaves the opt-in desktop tests out of the run entirely.
        # A test that hangs for 5 minutes is killed and a mini dump is collected.
        run: |
          dotnet test --no-build --configuration Release `
            --filter "Category!=Desktop" `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type mini `
            --collect:"XPlat Code Coverage" `
            --results-directory ./TestResults `
            --logger "trx;LogFileName=test-results.trx"

      - name: Check that desktop tests are skipped without the opt-in
        # The run above leaves desktop tests out. This one runs only them, with
        # WAM_ALLOW_DESKTOP_TESTS unset, and fails unless every one was reported as skipped, so CI
        # proves the gate skips them on the runner (the gate's canaries are always among them).
        shell: pwsh
        run: |
          Remove-Item Env:WAM_ALLOW_DESKTOP_TESTS -ErrorAction SilentlyContinue
          $results = Join-Path $PWD 'TestResults/desktop-gate'
          dotnet test --no-build --configuration Release `
            --filter "Category=Desktop" `
            --results-directory $results `
            --logger trx
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet test exited with code $LASTEXITCODE."
          }
          $trx = @(Get-ChildItem -LiteralPath $results -Filter *.trx -Recurse -File)
          if ($trx.Count -eq 0) {
            throw "dotnet test wrote no .trx file to $results."
          }
          $namespace = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $outcomes = @(Select-Xml -LiteralPath $trx.FullName -XPath '//t:UnitTestResult/@outcome' -Namespace $namespace |
            ForEach-Object { $_.Node.Value })
          $skipped = @($outcomes | Where-Object { $_ -eq 'NotExecuted' }).Count
          $executed = $outcomes.Count - $skipped
          Write-Host "Desktop tests without WAM_ALLOW_DESKTOP_TESTS: $skipped skipped, $executed executed."
          if ($executed -gt 0 -or $skipped -eq 0) {
            throw 'Every desktop test must be skipped without WAM_ALLOW_DESKTOP_TESTS, and there must be at least one.'
          }

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: 'CoverageReport'
          reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx

      - name: Upload hang diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hang-diagnostics
          path: |
            TestResults/**/*.dmp
            TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

      - name: Add coverage to summary
        run: |
          Get-Content CoverageReport/SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Check coverage threshold
        # The Category!=Desktop suite measured 60.38% line coverage (Release, October 2026).
        # The threshold leaves about one point of headroom for runner-dependent paths
        # (window and process enumeration); raise it as coverage grows.
        run: |
          $threshold = 59
          $xml = [xml](Get-Content -Path (Get-ChildItem -Path TestResults -Filter coverage.cobertura.xml -Recurse | Select-Object -First 1).FullName)
          $coverage = [double]$xml.coverage.'line-rate' * 100
          Write-Host "Line coverage: $coverage%"
          if ($coverage -lt $threshold) {
            Write-Error "Coverage $coverage% is below threshold of $threshold%"
            exit 1
          }
          Write-Host "Coverage check passed!"
