name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Desktop tests launch real apps; they are skipped unless one of these is exactly 1.
      # The end-to-end tests against the fixture app run only in e2e.yml.
      # See TESTING.md, "Desktop Tests".
      WAM_ALLOW_DESKTOP_TESTS: '0'
      WAM_ALLOW_DESKTOP_NOINPUT_TESTS: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        # Runs every test project in the solution. Category!=Desktop leaves the opt-in desktop tests
        # (both tiers, including the fixture app scenarios) out of the run entirely; the end-to-end
        # project's own harness tests still run. A test that hangs for 5 minutes is killed and a mini
        # dump is collected. Each test project writes its own .trx file (default names, so a second
        # project cannot overwrite the first).
        run: |
          dotnet test --no-build --configuration Release `
            --filter "Category!=Desktop" `
            --blame-hang-timeout 5m `
            --blame-hang-dump-type mini `
            --collect:"XPlat Code Coverage" `
            --results-directory ./TestResults `
            --logger trx

      - name: Check that desktop tests are skipped without the opt-in
        # The run above leaves desktop tests out. This one runs only them (both tiers, every test
        # project), with both opt-in variables unset, and fails unless every one was reported as
        # skipped, so CI proves the gate skips them on the runner. The gate's canaries and the fixture
        # app scenarios of WindowsAppManagerMcp.E2ETests must both be among them.
        shell: pwsh
        run: |
          Remove-Item Env:WAM_ALLOW_DESKTOP_TESTS -ErrorAction SilentlyContinue
          Remove-Item Env:WAM_ALLOW_DESKTOP_NOINPUT_TESTS -ErrorAction SilentlyContinue
          $results = Join-Path $PWD 'TestResults/desktop-gate'
          dotnet test --no-build --configuration Release `
            --filter "Category=Desktop" `
            --results-directory $results `
            --logger trx
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet test exited with code $LASTEXITCODE."
          }
          $trx = @(Get-ChildItem -LiteralPath $results -Filter *.trx -Recurse -File)
          if ($trx.Count -eq 0) {
            throw "dotnet test wrote no .trx file to $results."
          }
          $namespace = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $tests = @(Select-Xml -LiteralPath $trx.FullName -XPath '//t:UnitTestResult' -Namespace $namespace |
            ForEach-Object { [pscustomobject]@{ Name = $_.Node.testName; Outcome = $_.Node.outcome } })
          $skipped = @($tests | Where-Object { $_.Outcome -eq 'NotExecuted' })
          $executed = $tests.Count - $skipped.Count
          $e2eSkipped = @($skipped | Where-Object { $_.Name -like 'WindowsAppManagerMcp.E2ETests.*' }).Count
          Write-Host "Desktop tests without the opt-ins: $($skipped.Count) skipped ($e2eSkipped end-to-end), $executed executed."
          if ($executed -gt 0 -or $skipped.Count -eq 0) {
            throw 'Every desktop test must be skipped without WAM_ALLOW_DESKTOP_TESTS and WAM_ALLOW_DESKTOP_NOINPUT_TESTS, and there must be at least one.'
          }
          if ($e2eSkipped -eq 0) {
            throw 'The fixture app scenarios of WindowsAppManagerMcp.E2ETests must be among the skipped desktop tests.'
          }

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: '**/coverage.cobertura.xml'
          targetdir: 'CoverageReport'
          reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx

      - name: Upload hang diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hang-diagnostics
          path: |
            TestResults/**/*.dmp
            TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

      - name: Add coverage to summary
        run: |
          Get-Content CoverageReport/SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Check coverage threshold
        # Line coverage of the server assembly (package WindowsAppManagerMcp) in the Category!=Desktop
        # run, merged over every test project's coverage file: a line counts as covered when any test
        # project covers it. One file per project would not do: the end-to-end project covers almost
        # nothing in this run (its scenarios are desktop tests), and the order of the files is arbitrary.
        # Lines are keyed by full source path: coverlet writes file names relative to a <source> root that
        # depends on which assemblies a project instruments, so relative names need not match across files.
        # Merged, the suite measured 75.66% line coverage locally (Release, October 2026). The threshold of
        # 59 dates from a measurement of 60.38% and has not been re-baselined yet; raise it to about a point
        # below what CI reports here, leaving room for runner-dependent paths (window and process enumeration).
        shell: pwsh
        run: |
          $threshold = 59
          $package = 'WindowsAppManagerMcp'
          $files = @(Get-ChildItem -Path TestResults -Filter coverage.cobertura.xml -Recurse -File)
          if ($files.Count -eq 0) {
            throw 'No coverage.cobertura.xml was written to TestResults.'
          }
          function Resolve-SourcePath([string]$fileName, [string[]]$sources) {
            if ($sources.Count -eq 0 -or [System.IO.Path]::IsPathFullyQualified($fileName)) {
              return $fileName
            }
            foreach ($source in $sources) {
              $candidate = Join-Path $source $fileName
              if (Test-Path -LiteralPath $candidate) {
                return [System.IO.Path]::GetFullPath($candidate)
              }
            }
            return [System.IO.Path]::GetFullPath((Join-Path $sources[0] $fileName))
          }
          $valid = @{}
          $covered = @{}
          foreach ($file in $files) {
            $xml = [xml](Get-Content -LiteralPath $file.FullName)
            $sources = @($xml.SelectNodes('/coverage/sources/source') | ForEach-Object { $_.InnerText })
            foreach ($class in $xml.SelectNodes("/coverage/packages/package[@name='$package']/classes/class")) {
              $path = Resolve-SourcePath $class.filename $sources
              foreach ($line in $class.SelectNodes('lines/line')) {
                $key = "${path}:$($line.number)"
                $valid[$key] = $true
                if ([long]$line.hits -gt 0) {
                  $covered[$key] = $true
                }
              }
            }
          }
          if ($valid.Count -eq 0) {
            throw "No coverage file reports the $package package."
          }
          $coverage = [math]::Round(100.0 * $covered.Count / $valid.Count, 2)
          Write-Host "Line coverage of ${package}: $coverage% ($($covered.Count) of $($valid.Count) lines, $($files.Count) coverage files)"
          if ($coverage -lt $threshold) {
            Write-Error "Coverage $coverage% is below threshold of $threshold%"
            exit 1
          }
          Write-Host "Coverage check passed!"
